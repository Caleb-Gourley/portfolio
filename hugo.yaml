baseURL: https://caleb-gourley.github.io/portfolio/
languageCode: en-us
locale: en-us
title: "Caleb Gourley | Game Developer"
theme: PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false

pagination:
  pagerSize: 10

# Needed for the Search page
outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  title: "Caleb Gourley | Game Developer"
  description: "Game development portfolio, featuring gameplay programming, technical systems, tools and interactive experiences."
  author: Caleb Gourley
  defaultTheme: auto
  disableThemeToggle: false

  mainSections:
    - projects

  ShowReadingTime: false
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: false
  hideFooter: false

  profileMode:
    enabled: true
    title: "Caleb Gourley"
    subtitle: "Game developer and programmer specialising in gameplay systems, networking and interactive experiences."
    imageUrl: images/profile.png
    imageTitle: "Profile photo"
    imageWidth: 160
    imageHeight: 160
    buttons:
      - name: Projects
        url: projects/
      - name: About
        url: about/
      - name: CV
        url: pdf/caleb-gourley-cv.pdf
    subtitle2: "I build games and interactive systems with Unity, Unreal Engine, C# and C++. Explore my projects, technical work and experience."

  socialIcons:
    - name: github
      url: https://github.com/Caleb-Gourley
    - name: itchio
      url: https://caleb-gourley.itch.io/
    - name: linkedin
      url: https://www.linkedin.com/in/caleb-gourley-924a6131b/
    - name: email
      url: mailto:calebgourley@outlook.com

  cover:
    hiddenInList: false
    hiddenInSingle: false

  fuseOpts:
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 10
    - identifier: about
      name: About
      url: /about/
      weight: 20
    - identifier: cv
      name: CV
      url: /pdf/caleb-gourley-cv.pdf
      weight: 30
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 40
    - identifier: search
      name: Search
      url: /search/
      weight: 50

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
